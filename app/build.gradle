plugins {
    id 'com.android.application'
}

android {
    namespace 'bg.arduino.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'bg.arduino.uploader'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}
